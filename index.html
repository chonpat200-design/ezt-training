<style>
  body { font-family: 'Sarabun', sans-serif; transition: filter 0.3s ease; }

  /* หัวข้อใหญ่หน้าแรก: ภาษาไทยมีสระ/วรรณยุกต์บน-ล่าง ต้องเว้นระยะบรรทัดกว้างกว่าปกติ
     ใช้ !important เพื่อไม่ให้ค่าอื่น (Tailwind/ฟอนต์) มาทับจนบรรทัดชิดกัน */
  .hero-title { line-height: 2 !important; }

  /* ===== Dark Mode (invert-filter approach) =====
     ใช้วิธี invert สีทั้งหน้าแทนการไล่ Override สีทีละคลาส เพราะเว็บนี้ใช้ Tailwind Arbitrary Color
     จำนวนมาก (รวม Opacity Variant นับร้อยแบบ) การ Override ทีละคลาสจะไม่ครบและเสี่ยงพลาดจุดใดจุดหนึ่ง
     วิธีนี้ให้ผลลัพธ์ Dark Mode ที่ใช้ได้จริงทั้งเว็บโดยไม่ต้องแก้สีทีละจุด */
  body.dark-mode { filter: invert(1) hue-rotate(180deg); background: #fff; }
  body.dark-mode img,
  body.dark-mode svg image,
  body.dark-mode iframe,
  body.dark-mode video,
  body.dark-mode canvas,
  body.dark-mode .no-invert {
    filter: invert(1) hue-rotate(180deg);
  }
  .theme-toggle-btn {
    width: 34px; height: 34px; border-radius: 9999px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid rgba(27,27,24,0.15); background: transparent; cursor: pointer;
    transition: all .15s ease;
  }
  .theme-toggle-btn:hover { border-color: #1B1B18; }

  /* ===== Confetti (ตอนได้ใบรับรอง) ===== */
  .confetti-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
  .confetti-piece { position: absolute; top: -12px; animation-name: confettiFall; animation-timing-function: cubic-bezier(.25,.46,.45,.94); animation-fill-mode: forwards; }
  @keyframes confettiFall {
    0%   { transform: translateY(-10px) translateX(0) rotate(0deg); opacity: 1; }
    70%  { opacity: 1; }
    100% { transform: translateY(100vh) translateX(var(--drift, 0px)) rotate(600deg); opacity: 0; }
  }

  /* ===== Streak badge (เรียนติดต่อกันกี่วัน) ===== */
  .streak-badge { transition: transform .25s ease; }
  .streak-badge.bump { animation: streakPop 0.6s ease; }
  @keyframes streakPop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.28); }
    60%  { transform: scale(0.95); }
    100% { transform: scale(1); }
  }
  .streak-flame-glow { filter: drop-shadow(0 0 5px rgba(193,67,46,0.55)); }

  /* ===== Mini Achievement Badges ===== */
  .badge-chip { transition: transform .15s ease; }
  .badge-chip:hover { transform: translateY(-2px); }
  .badge-toast { animation: badgeToastIn 0.45s cubic-bezier(.22,1,.36,1), badgeToastOut 0.45s ease forwards; animation-delay: 0s, 3.15s; }
  @keyframes badgeToastIn {
    0%   { transform: translateY(16px) scale(0.92); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes badgeToastOut {
    0%   { opacity: 1; }
    100% { opacity: 0; transform: translateY(-6px); }
  }
  .badge-locked { filter: grayscale(1); opacity: 0.32; }

  /* ===== Motion kit (อนิเมชันกลางของระบบ) — ปิดอัตโนมัติถ้าผู้ใช้ตั้งค่าลดการเคลื่อนไหวในเครื่อง ===== */
  .reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1); will-change: opacity, transform; }
  .reveal.in { opacity: 1; transform: none; }
  .phase-enter { animation: phaseIn .45s cubic-bezier(.22,1,.36,1) both; }
  @keyframes phaseIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  .stagger-in { animation: fadeIn .45s cubic-bezier(.22,1,.36,1) both; }
  .choice-pop { animation: choicePop .3s cubic-bezier(.22,1,.36,1); }
  @keyframes choicePop { 0% { transform: scale(.98); } 50% { transform: scale(1.015); } 100% { transform: scale(1); } }
  .bar-grow { transform-box: fill-box; transform-origin: 50% 100%; animation: barGrow .9s cubic-bezier(.22,1,.36,1) both; }
  @keyframes barGrow { from { transform: scaleY(0); } }
  .bar-grow-x { transform-origin: 0 50%; animation: barGrowX .9s cubic-bezier(.22,1,.36,1) both; }
  @keyframes barGrowX { from { transform: scaleX(0); } }
  .donut-seg { animation: donutIn 1.1s cubic-bezier(.22,1,.36,1) both; }
  @keyframes donutIn { from { stroke-dasharray: 0 100; } }
  .line-draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: lineDraw 1.5s ease both; }
  @keyframes lineDraw { from { stroke-dashoffset: 1; } }
  .area-fade { animation: fadeOnly 1.2s ease .5s both; }
  @keyframes fadeOnly { from { opacity: 0; } }
  .pop-in { animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popIn { from { opacity: 0; transform: scale(.6); } }
  .float-slow { animation: floatY 7s ease-in-out infinite; }
  @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
  .xp-fill { transition: width 1.1s cubic-bezier(.22,1,.36,1); }
  .shine { position: relative; overflow: hidden; }
  .shine::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.4) 50%, transparent 70%); transform: translateX(-100%); animation: shineSweep 2.8s ease-in-out infinite; }
  @keyframes shineSweep { 60%, 100% { transform: translateX(100%); } }
  .step-bar { transform: scaleX(0); transform-origin: 0 50%; transition: transform 1.6s ease .3s; }
  .reveal.in .step-bar { transform: scaleX(1); }
  .lift { transition: transform .25s ease, box-shadow .25s ease; }
  .lift:hover { transform: translateY(-4px); box-shadow: 0 14px 30px -14px rgba(14,34,51,.35); }
  .xp-pop { animation: xpPop .7s cubic-bezier(.34,1.56,.64,1) .35s both; }
  @keyframes xpPop { from { opacity: 0; transform: translateY(10px) scale(.8); } }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .phase-enter, .stagger-in, .choice-pop, .bar-grow, .bar-grow-x, .donut-seg, .line-draw, .area-fade, .pop-in, .float-slow, .xp-pop, .shine::after { animation: none !important; }
    .step-bar { transform: scaleX(1); transition: none; }
    .xp-fill { transition: none; }
  }

  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }

  .field input, .field select {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid rgba(27,27,24,0.18);
    background: transparent;
    padding: 8px 2px 10px 2px;
    font-family: 'Sarabun', sans-serif;
    font-size: 16px;
    color: #1B1B18;
    outline: none;
    transition: border-color .15s ease;
  }
  .field input::placeholder { color: rgba(27,27,24,0.28); }
  .field input:focus, .field select:focus { border-bottom-color: #C1432E; }
  .field label { display:block; font-size:12.5px; color:rgba(27,27,24,0.55); margin-bottom:8px; font-weight:500; }
  .field.code input { font-family: 'Chakra Petch', sans-serif; letter-spacing: 0.1em; }

  .chip {
    font-family: 'Sarabun', sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    border: 1.3px solid rgba(27,27,24,0.18);
    border-radius: 3px;
    background: transparent;
    color: rgba(27,27,24,0.7);
    cursor: pointer;
    transition: all .12s ease;
    max-width: 200px;
    white-space: normal;
    line-height: 1.35;
    text-align: center;
  }
  .chip:hover { border-color: #1B1B18; }
  .chip.active { background: #C1432E; border-color: #C1432E; color: #fff; }

  .btn-primary {
    background: #1B1B18; color: #F3EEE3;
    font-weight: 600; border-radius: 3px; transition: background .15s ease;
  }
  .btn-primary:hover { background: #9E3423; }
  .btn-primary:disabled { background: rgba(27,27,24,0.25); cursor:not-allowed; }

  /* ===== Intro splash screen ===== */
  .intro-stage { background: radial-gradient(circle at 50% 35%, #16324A 0%, #0E2233 55%, #081722 100%); }
  .intro-net-line {
    fill: none; stroke: #4A7285; stroke-width: 1; opacity: 0.45;
    stroke-dasharray: 6 10; animation: introFlow 6s linear infinite;
  }
  .intro-net-line.alt { stroke: #C1432E; opacity: 0.3; animation-duration: 8s; animation-direction: reverse; }
  @keyframes introFlow { to { stroke-dashoffset: -320; } }
  .intro-node { fill: #9FB4C4; animation: introPulse 3.2s ease-in-out infinite; }
  .intro-node.rust { fill: #C1432E; animation-duration: 2.4s; }
  .intro-node.teal { fill: #2F6F64; animation-duration: 4s; }
  @keyframes introPulse { 0%,100% { opacity: 0.35; r: 3; } 50% { opacity: 1; r: 5; } }

  .intro-diamond {
    animation: introDiamondIn 0.9s cubic-bezier(.2,.8,.2,1) both, introGlow 2.4s ease-in-out infinite 0.9s;
  }
  @keyframes introDiamondIn { from { opacity: 0; transform: rotate(45deg) scale(0.2); } to { opacity: 1; transform: rotate(45deg) scale(1); } }
  @keyframes introGlow { 0%,100% { filter: drop-shadow(0 0 3px rgba(193,67,46,0.5)); } 50% { filter: drop-shadow(0 0 14px rgba(193,67,46,0.9)); } }

  .intro-letter { display:inline-block; opacity:0; animation: introLetterIn 0.6s ease-out forwards; }
  .intro-shimmer {
    background: linear-gradient(90deg, #F6F1E6 20%, #C1432E 50%, #F6F1E6 80%);
    background-size: 250% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: introShimmer 3.5s linear infinite;
  }
  @keyframes introLetterIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes introShimmer { to { background-position: -250% center; } }

  .intro-fadeup { opacity: 0; animation: introFadeUp 0.8s ease-out forwards; }
  @keyframes introFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .intro-cta { opacity: 0; animation: introFadeUp 0.7s ease-out forwards; }

  .intro-network { opacity: 0; animation: introNetIn 1.8s ease-out forwards; }
  @keyframes introNetIn { to { opacity: 1; } }

  .intro-vignette {
    background: radial-gradient(circle at 50% 42%, transparent 30%, rgba(8,23,34,0.6) 100%);
  }

  .intro-logo-wrap { position: relative; width: 16px; height: 16px; }
  .intro-orbit-wrap { position: absolute; top: 50%; left: 50%; width: 0; height: 0; }
  .intro-orbit-dot {
    position: absolute; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%;
    background: #C1432E; box-shadow: 0 0 8px rgba(193,67,46,0.7);
    animation: introOrbit 6s linear infinite;
  }
  .intro-orbit-dot.b { background: #2F6F64; box-shadow: 0 0 8px rgba(47,111,100,0.7); animation-duration: 8s; animation-direction: reverse; }
  @keyframes introOrbit { from { transform: rotate(0deg) translateX(30px); } to { transform: rotate(360deg) translateX(30px); } }

  .intro-cursor { animation: introBlink 1s steps(1) infinite; }
  @keyframes introBlink { 50% { opacity: 0; } }

  /* ===== Intro 2.0: โลโก้เปิดตัว + 7 แผนกโคจร + อนุภาคตามเมาส์ + ฉากพุ่งผ่าน ===== */
  .i3-root { background: #081722; position: relative; overflow: hidden; }
  .i3-scene { position: relative; min-height: 100vh; overflow: hidden; background: radial-gradient(circle at 50% 40%, #16324A 0%, #0E2233 55%, #081722 100%); }
  .i3-scene.warp { animation: i3Warp .95s cubic-bezier(.55,0,.8,.4) forwards; }
  @keyframes i3Warp { to { transform: scale(2.8); filter: blur(7px); opacity: 0; } }
  .i3-flash { position: absolute; inset: 0; pointer-events: none; z-index: 40; opacity: 0; background: radial-gradient(circle at 50% 43%, #fff 0%, #ffe9e2 40%, #fff 100%); }
  .i3-flash.on { animation: i3Flash .95s ease-in forwards; }
  @keyframes i3Flash { 0%, 45% { opacity: 0; } 100% { opacity: 1; } }

  .i3-aurora { position: absolute; border-radius: 9999px; filter: blur(80px); pointer-events: none; mix-blend-mode: screen; opacity: 0; animation: i3AuroraIn 2.4s ease-out .2s forwards, i3Drift 18s ease-in-out infinite alternate; }
  .i3-aurora.a { width: 52vw; height: 52vw; left: -12vw; top: -18vw; background: rgba(193,67,46,.20); }
  .i3-aurora.b { width: 46vw; height: 46vw; right: -10vw; top: 12vh; background: rgba(47,111,100,.26); animation-delay: .4s, -6s; animation-duration: 2.4s, 22s; }
  .i3-aurora.c { width: 40vw; height: 40vw; left: 28vw; bottom: -24vw; background: rgba(60,110,170,.22); animation-delay: .6s, -12s; animation-duration: 2.4s, 26s; }
  @keyframes i3AuroraIn { to { opacity: 1; } }
  @keyframes i3Drift { from { transform: translate(0,0) scale(1); } to { transform: translate(6vw, 4vh) scale(1.15); } }

  .i3-diamond { width: 20px; height: 20px; background: #C1432E; transform: rotate(45deg) scale(0); opacity: 0; animation: i3Diamond 1.1s cubic-bezier(.2,.9,.2,1.2) .35s forwards, introGlow 2.4s ease-in-out 1.5s infinite; }
  @keyframes i3Diamond { 0% { opacity: 0; transform: rotate(45deg) scale(0); } 55% { opacity: 1; transform: rotate(225deg) scale(1.9); } 100% { opacity: 1; transform: rotate(405deg) scale(1); } }

  .i3-letter { display: inline-block; opacity: 0; filter: blur(16px); transform: translateY(22px) scale(1.25); animation: i3Letter .95s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes i3Letter { to { opacity: 1; filter: blur(0); transform: none; } }
  .i3-type { display: inline-block; overflow: hidden; white-space: nowrap; max-width: 0; vertical-align: bottom; animation: i3Typing 1.5s steps(38) 2s forwards; }
  @keyframes i3Typing { to { max-width: 40em; } }
  .i3-up { opacity: 0; animation: introFadeUp .8s ease-out forwards; }
  .i3-cta { opacity: 0; animation: introFadeUp .7s ease-out 3.9s forwards, i3Pulse 2.6s ease-in-out 4.6s infinite; }
  @keyframes i3Pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(193,67,46,.55); } 50% { box-shadow: 0 0 0 14px rgba(193,67,46,0); } }

  .i3-dept { position: absolute; left: 0; top: 0; opacity: 0; z-index: 6; will-change: transform, opacity; }
  .i3-dept-icon { width: 46px; height: 46px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: #F6F1E6; background: rgba(14,34,51,.78); border: 1px solid rgba(159,180,196,.45); backdrop-filter: blur(4px); box-shadow: 0 0 18px rgba(193,67,46,.25); transition: border-color .2s, box-shadow .2s, background .2s; cursor: default; }
  .i3-dept:hover .i3-dept-icon { border-color: #C1432E; background: rgba(193,67,46,.35); box-shadow: 0 0 26px rgba(193,67,46,.7); }
  .i3-dept-name { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 6px; font-family: 'Chakra Petch', sans-serif; font-size: 10.5px; letter-spacing: .08em; color: #B9C6CE; white-space: nowrap; }
  .i3-dept-tip { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, 4px); margin-bottom: 8px; padding: 6px 10px; border-radius: 8px; background: rgba(8,23,34,.92); border: 1px solid rgba(159,180,196,.3); color: #F6F1E6; font-size: 11px; line-height: 1.35; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
  .i3-dept:hover .i3-dept-tip { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 640px) { .i3-dept-icon { width: 36px; height: 36px; } .i3-dept-name { display: none; } }

  /* ผู้ใช้ตั้งค่าลดการเคลื่อนไหว: แสดงทุกอย่างทันที ไม่มีอนิเมชัน */
  @media (prefers-reduced-motion: reduce) {
    .i3-aurora { animation: none !important; opacity: 1; }
    .i3-diamond { animation: none; opacity: 1; transform: rotate(45deg); }
    .i3-letter { animation: none; opacity: 1; filter: none; transform: none; }
    .i3-type { animation: none; max-width: 40em; }
    .i3-up, .i3-cta { animation: none; opacity: 1; }
  }
</style>

async function callClaudeAPI(apiKey, model, systemPrompt, userPrompt, maxTokens = 1024) {
  if (!AI_ENDPOINT) throw new Error("AI_ENDPOINT_NOT_SET");
  const res = await fetch(AI_ENDPOINT, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      model: model || DEFAULT_MODEL,
      maxTokens,
      system: systemPrompt,
      prompt: userPrompt
    })
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => "");
    throw new Error("API_ERROR_" + res.status + " " + errText);
  }
  const data = await res.json();
  return data && typeof data.text === "string" ? data.text : "";
}

(ทำต่อในรูปแบบเดียวกันจนครบทุกข้อ)`;
  const parseQuizText = (text) => {
    const out = [];
    String(text || "").split(/^\s*-{3,}\s*$/m).forEach((block) => {
      const get = (k) => {
        const m = block.match(new RegExp("^[ \\t]*" + k + "[ \\t]*[:：][ \\t]*(.+)$", "mi"));
        return m ? m[1].trim() : "";
      };

      out.push({ q, choices, answer: "ABCD".indexOf(ans[0]), skill: get("SKILL") || "ประเด็นทั่วไป", explain: get("EXPLAIN") || "" });
    });
    return out;

function shuffleQuizChoices(questions) {
  return questions.map((q) => {
    if (!q || !Array.isArray(q.choices) || typeof q.answer !== "number") return q;
    const order = q.choices.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    return { ...q, choices: order.map((i) => q.choices[i]), answer: order.indexOf(q.answer) };
  });
}
